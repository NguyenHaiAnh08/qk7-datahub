name: DevSecOps Security Pipeline — QK7 DataHub

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: 🔒 Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@f672a9261ff3608144ef9155940c0341774e5480 # v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  sast-semgrep:
    name: 🛡️ SAST Scan (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Semgrep Security Audit
        run: |
          semgrep scan \
            --config "p/security-audit" \
            --config "p/owasp-top-ten" \
            --sarif \
            --output semgrep.sarif \
            .
        continue-on-error: true

      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@6bb034414c761b3035778b00e2615456230739c1 # v3.28.11
        with:
          sarif_file: semgrep.sarif
        if: always()

  sca-audit:
    name: 📦 Software Composition Analysis (SCA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Audit Backend Dependencies
        run: |
          cd backend
          npm audit --audit-level=high

      - name: Audit Frontend Dependencies
        run: |
          cd frontend
          npm audit --audit-level=high

      - name: Setup Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'

      - name: Audit Python Boxchat Dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          if [ -f boxchat/requirements.txt ]; then
            pip-audit -r boxchat/requirements.txt || true
          fi

  build-verification:
    name: 🏗️ Build Verification
    runs-on: ubuntu-latest
    needs: [sast-semgrep, sca-audit]
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22.x

      - name: Verify Frontend Build
        run: |
          cd frontend
          npm ci
          npm run build
