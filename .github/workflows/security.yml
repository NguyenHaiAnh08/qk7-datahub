name: DevSecOps Security Pipeline — QK7 DataHub

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  secret-scan:
    name: 🔒 Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  sast-semgrep:
    name: 🛡️ SAST Scan (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Semgrep Security Audit
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" semgrep/semgrep semgrep scan \
            --config "p/security-audit" \
            --config "p/owasp-top-ten" \
            --sarif \
            --output /src/semgrep.sarif \
            /src || true

      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
        if: always()
        continue-on-error: true

  sca-audit:
    name: 📦 Software Composition Analysis (SCA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Audit Backend Dependencies
        run: |
          cd backend
          npm audit --audit-level=high

      - name: Audit Frontend Dependencies
        run: |
          cd frontend
          npm audit --audit-level=high

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Audit Python Boxchat Dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          if [ -f boxchat/requirements.txt ]; then
            pip-audit -r boxchat/requirements.txt || true
          fi

  build-verification:
    name: 🏗️ Build Verification
    runs-on: ubuntu-latest
    needs: [sast-semgrep, sca-audit]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Verify Frontend Build
        run: |
          cd frontend
          npm ci
          npm run build
