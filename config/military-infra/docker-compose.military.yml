# ==============================================================================
# Docker Compose — Kiến Trúc Tự Chủ 100% Quân Đội (Air-Gapped Stack)
# Chạy đồng bộ: CoreDNS Nội Bộ (:53) + Nginx TLS Edge (:80/:443) + Gateway (:8000) + AI (:8001)
# Cách chạy (từ thư mục gốc dự án):
#   docker compose -f docker-compose.yml -f config/military-infra/docker-compose.military.yml up -d
# ==============================================================================
services:
  dns:
    image: coredns/coredns:1.11.3
    container_name: qk7-dns
    restart: unless-stopped
    command: -conf /etc/coredns/Corefile
    ports:
      - "0.0.0.0:53:53/udp"
      - "0.0.0.0:53:53/tcp"
    volumes:
      - ./dns/Corefile:/etc/coredns/Corefile:ro
      - ./dns/tqsqk7.edu.zone:/etc/coredns/tqsqk7.edu.zone:ro
    networks:
      - qk7-net

  edge-proxy:
    image: nginx:1.27-alpine
    container_name: qk7-edge-proxy
    restart: unless-stopped
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./proxy/nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../backend/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    networks:
      - qk7-net

  backend:
    environment:
      # Khi chạy sau Nginx Edge Proxy, tắt listener 443/80 trực tiếp trên Express
      PUBLIC_HTTPS_PORT: "0"
      HTTP_REDIRECT_PORT: "0"
      TRUST_PROXY: "1"
    volumes:
      - ../../backend/certs:/app/certs:ro
