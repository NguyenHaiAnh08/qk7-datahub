# ==============================================================================
# HAProxy High-Availability Load Balancer — QK7 DataHub Military Scale (1M+ Devices)
# Kết hợp cùng Keepalived VRRP Virtual IP (VIP) để đạt độ sẵn sàng 99.99% (Zero-Downtime)
# ==============================================================================
global
    maxconn 200000
    nbthread 4
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    tune.ssl.default-dh-param 2048

defaults
    mode http
    option httplog
    option dontlognull
    option forwardfor
    option http-server-close
    timeout connect 5s
    timeout client  60s
    timeout server  120s
    timeout tunnel  24h   # Giữ kết nối WebSocket ZKTeco 2FA ổn định 24/7

frontend qk7_http_in
    bind *:80
    http-request redirect scheme https code 301

frontend qk7_https_in
    bind *:443 ssl crt /etc/haproxy/certs/fullchain-and-key.pem alpn h2,http/1.1
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains"
    http-request set-header X-Forwarded-Proto https

    acl is_ws path_beg /ws/fingerprint
    use_backend qk7_ws_backend if is_ws
    default_backend qk7_gateway_backend

backend qk7_ws_backend
    balance source
    option httpchk GET /api/health
    server gw1 192.168.1.229:8000 ssl verify none check inter 5s fall 3 rise 2
    # server gw2 192.168.1.150:8000 ssl verify none check inter 5s fall 3 rise 2

backend qk7_gateway_backend
    balance leastconn
    option httpchk GET /api/health
    http-check expect status 200
    server gw1 192.168.1.229:8000 ssl verify none check inter 5s fall 3 rise 2
    # server gw2 192.168.1.150:8000 ssl verify none check inter 5s fall 3 rise 2
