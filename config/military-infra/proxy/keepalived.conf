# ==============================================================================
# Keepalived VRRP Virtual IP (VIP) — Chuyển mạch dự phòng tự động < 1 giây
# Cài trên 2 nút Load Balancer (MASTER priority 150, BACKUP priority 100)
# Bản ghi DNS A (trungtamdulieuso.tqsqk7.edu) trỏ thẳng vào Virtual IP này!
# ==============================================================================
global_defs {
    router_id QK7_LB_MASTER
    enable_script_security
}

vrrp_script chk_proxy {
    script "/usr/bin/killall -0 nginx || /usr/bin/killall -0 haproxy"
    interval 2
    weight 20
    fall 2
    rise 2
}

vrrp_instance VI_QK7_DATAHUB {
    state MASTER
    interface eth0
    virtual_router_id 77
    priority 150
    advert_int 1

    authentication {
        auth_type PASS
        auth_pass CHANGE_ME_VRRP_SECRET
    }

    # Địa chỉ IP ảo cố định (VIP) dùng chung cho cụm Load Balancer Quân sự
    virtual_ipaddress {
        192.168.1.250/24
    }

    track_script {
        chk_proxy
    }
}
