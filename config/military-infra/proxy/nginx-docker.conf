# ==============================================================================
# Nginx Edge Reverse Proxy (Docker Air-Gapped Stack) — QK7 DataHub
# Sử dụng cùng config/military-infra/docker-compose.military.yml
# ==============================================================================

limit_req_zone $binary_remote_addr zone=qk7_api_limit:20m rate=60r/s;
limit_req_zone $binary_remote_addr zone=qk7_auth_limit:10m rate=10r/m;

upstream qk7_gateway_docker {
    least_conn;
    server backend:8000 max_fails=3 fail_timeout=15s;
    keepalive 128;
}

server {
    listen 80;
    listen [::]:80;
    server_name trungtamdulieuso.tqsqk7.edu tqsqk7.cntt _;

    location ^~ /ca {
        proxy_pass https://qk7_gateway_docker;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name trungtamdulieuso.tqsqk7.edu tqsqk7.cntt;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/private-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:QK7_TLS:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 55M;
    client_body_timeout 120s;

    location /ws/fingerprint {
        proxy_pass https://qk7_gateway_docker;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location ~ ^/api/(ai/|files/.+/view) {
        proxy_pass https://qk7_gateway_docker;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location /api/auth/login {
        limit_req zone=qk7_auth_limit burst=10 nodelay;
        proxy_pass https://qk7_gateway_docker;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        limit_req zone=qk7_api_limit burst=120 nodelay;
        proxy_pass https://qk7_gateway_docker;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
