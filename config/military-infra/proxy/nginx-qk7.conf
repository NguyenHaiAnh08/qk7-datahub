# ==============================================================================
# Nginx Enterprise Military Edge Reverse Proxy — QK7 DataHub
# Kiến trúc Tự Chủ 100% Air-Gapped | Quy mô: 1.000.000+ thiết bị (PC & iPad)
# Phục vụ chuẩn: https://trungtamdulieuso.tqsqk7.edu (Port 443) + Redirect Port 80
# ==============================================================================

# Giới hạn tần suất chống bão kết nối nội bộ (Anti-DDoS / Brute-force Layer 7)
limit_req_zone $binary_remote_addr zone=qk7_api_limit:20m rate=60r/s;
limit_req_zone $binary_remote_addr zone=qk7_auth_limit:10m rate=10r/m;

# Cụm Upstream Express 5 Gateway (Mở rộng ngang thêm nhiều node khi > 50.000 CCU)
upstream qk7_gateway_pool {
    least_conn;
    server 127.0.0.1:8000 max_fails=3 fail_timeout=15s;
    # Mở rộng cụm Quân khu / Toàn quân — bỏ dấu # và thêm các node Gateway:
    # server 192.168.1.151:8000 max_fails=3 fail_timeout=15s;
    # server 192.168.1.152:8000 max_fails=3 fail_timeout=15s;
    keepalive 128;
}

# Cổng 80: Cho phép tải chứng chỉ gốc công khai tại /ca trước khi tin cậy HTTPS; mọi đường dẫn khác ép 301 sang HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name trungtamdulieuso.tqsqk7.edu tqsqk7.cntt _;

    location ^~ /ca {
        proxy_pass https://qk7_gateway_pool;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Cổng 443: Điểm vào chính (TLS 1.2/1.3 Termination + HTTP/2 + WebSocket 2FA)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name trungtamdulieuso.tqsqk7.edu tqsqk7.cntt;

    # Chứng chỉ Fullchain (Leaf + Issuing CA) từ Private Military PKI hoặc mkcert
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/private-key.pem;

    # Chuẩn mật mã Quân sự (Mozilla Modern/Intermediate TLS 1.2 + TLS 1.3)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:QK7_TLS:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Ẩn phiên bản Nginx & tuân thủ chính sách Security Headers trong docs/security/SECURITY.md
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Cho phép upload văn bản PDF / gói học liệu SCORM lên tới 55MB
    client_max_body_size 55M;
    client_body_timeout 120s;

    # 1. Kênh WebSocket 2 chiều cho Trạm Vân Tay ZKTeco ZK9500 (wss://trungtamdulieuso.tqsqk7.edu/ws/fingerprint)
    location /ws/fingerprint {
        proxy_pass https://qk7_gateway_pool;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 2. Luồng AI RAG Streaming (SSE) & Xem PDF bảo mật (Tắt buffering để không trễ token/chunk)
    location ~ ^/api/(ai/|files/.+/view) {
        proxy_pass https://qk7_gateway_pool;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # 3. Bảo vệ điểm đăng nhập chống dò mật khẩu ở tầng biên
    location /api/auth/login {
        limit_req zone=qk7_auth_limit burst=10 nodelay;
        proxy_pass https://qk7_gateway_pool;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 4. Toàn bộ SPA (React 18 Dual-Platform) & REST API
    location / {
        limit_req zone=qk7_api_limit burst=120 nodelay;
        proxy_pass https://qk7_gateway_pool;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
