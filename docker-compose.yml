services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: qk7-backend
    restart: unless-stopped
    ports:
      - "0.0.0.0:${PORT_BACKEND:-8000}:8000"
    env_file:
      - .env
    environment:
      BACKEND_UPLOADS_DIR: /app/uploads
      AI_SERVICE_URL: http://ai:8001
    volumes:
      - ./backend/uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - qk7-net
    depends_on:
      ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  ai:
    build:
      context: .
      dockerfile: boxchat/Dockerfile
    container_name: qk7-ai
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT_AI:-8001}:8001"
    env_file:
      - .env
    environment:
      BACKEND_UPLOADS_DIR: /app/uploads
      QDRANT_STORAGE_PATH: /app/local_storage/qdrant_data
    volumes:
      - ./backend/uploads:/app/uploads:ro
      - ./boxchat/local_storage:/app/local_storage
    networks:
      - qk7-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8001/ai/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

networks:
  qk7-net:
    driver: bridge